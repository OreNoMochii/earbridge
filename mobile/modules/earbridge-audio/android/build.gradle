plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.earbridgeaudio'
version = '0.1.0'

android {
  namespace "expo.modules.earbridgeaudio"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // On-phone translation: downloadable models, about 30 MB per language.
  implementation 'com.google.mlkit:translate:17.0.3'
  // Voice prints for "Only our voices" (from JitPack): ONNX Runtime and a speaker model's
  // front end, about 27 MB on arm64. The model downloads at first use. Only the Android
  // library: `com.github.k2-fsa:sherpa-onnx` would bring the desktop ones too.
  implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'
  // Separating voices (VoiceIsolator): ONNX Runtime's Java API, of exactly the version of
  // the runtime sherpa-onnx bundles (1.28.2): the runtime's symbols carry their version, so
  // another version's Java library can't load against it, and Maven Central's
  // onnxruntime-android has no 1.28.2. libs/get-onnxruntime-java.sh takes the Java part of
  // the same 1.28.2 build: this jar, and the JNI library in src/main/jniLibs. The runtime
  // itself comes with sherpa-onnx only. When sherpa-onnx changes, check the runtime version
  // it bundles and get the Java library of that version.
  implementation files('libs/onnxruntime-1.28.2.jar')
  testImplementation 'junit:junit:4.13.2'
}
